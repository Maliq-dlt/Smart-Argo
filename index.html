<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3f624d" />
    <meta name="description" content="Simulator asisten perawatan satu pot. Jelajahi riwayat tiga sensor, acuan lokal, dan keputusan yang dapat dijelaskan." />
    <title>Smart Agro - Simulator Satu Pot</title>
    <link rel="preload" href="%BASE_URL%fonts/fraunces-soft.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/general-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/nunito-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- First paint of the loading curtain, before scripts run; React's curtain takes over in place. -->
    <style>
      @font-face { font-family: 'Fraunces'; src: url('%BASE_URL%fonts/fraunces-soft.woff2') format('woff2'); font-weight: 300 600; font-display: swap; }
      @font-face { font-family: 'General Sans'; src: url('%BASE_URL%fonts/general-sans-400.woff2') format('woff2'); font-weight: 400 500; font-display: swap; }
      #boot { position: fixed; inset: 0; z-index: 299; display: grid; place-content: center; justify-items: center; gap: 8px; padding: 24px; background: #22382b; color: #eef1e9; text-align: center; }
      #boot i { width: 92px; height: 92px; }
      #boot b { margin-top: 8px; font: 420 34px/1.1 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100; letter-spacing: -.02em; }
      #boot span { font: 500 14px/1.4 'General Sans', 'Segoe UI', system-ui, sans-serif; color: rgb(238 241 233 / .72); }
      #boot s { display: block; width: 160px; height: 2px; margin-top: 14px; border-radius: 2px; background: rgb(238 241 233 / .18); }
      @media (prefers-reduced-motion: reduce) { #boot { display: none; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><i></i><b>Smart Agro</b><span>Membaca zona akar…</span><s></s></div>
    <div id="root"></div>
    <script vite-ignore src="%BASE_URL%runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
